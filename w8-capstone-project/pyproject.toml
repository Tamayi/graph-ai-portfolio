[project]
name = "graph-ai-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core RAG stack
    "anthropic>=0.40.0",
    "voyageai>=0.3.2",
    "chromadb>=0.5.5",
    # Web app (FastAPI backend serving the Claude Design frontend)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Optional alternative front end
    "streamlit>=1.39.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "python-dotenv>=1.0.1",
    # Markdown / text utilities
    "tiktoken>=0.8.0",
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Tests run with no API keys and no network; the LLM, embedding and vector calls
# are mocked or stubbed in tests/conftest.py.

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]  # line length is handled by black

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # imports after the sys.path / stub setup in conftest

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these as argument defaults by design (File/Form/Depends/Query).
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.black]
line-length = 88
target-version = ["py313"]
